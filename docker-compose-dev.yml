version: '3.8'

services:
  ebpf-builder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebpf-visual-builder
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3007/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
  # Desenvolvimento com hot reload
  ebpf-builder-dev:
    image: node:20-alpine
    container_name: ebpf-visual-builder-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    profiles:
      - dev

networks:
  default:
    name: ebpf-builder-network