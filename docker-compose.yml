version: '3.8'

services:
  ebpf-design:
    image: qweralfredo/ebpf-design:latest
    ports:
      - "3007:3007"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3007/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s